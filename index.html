<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rook — open-source games and tools</title>
  <style>
    /* Direction 3: Hybrid
       - Structure / layout: from Direction 1 (boot screen)
         * Status bar at top
         * Centered hero with title + tagline + press-key blink
         * Project list as cards with rank/name/year/score
         * Cabinet-feel footer
       - Visual energy / glow: from Direction 2 (high score)
         * Full color palette with chromatic aberration on key text
         * Box-shadow glow on key elements
         * Multi-color typography (not monochrome)
         * Brighter background
         * Starfield backdrop */

    :root {
      --bg: #0c0820;
      --panel: #1a0a35;
      --amber: #ffb244;
      --gold: #ffcc33;
      --pink: #ff66cc;
      --blue: #44aaff;
      --purple: #cc88ff;
      --green: #66ff99;
      --text: #ffeebb;
      --dim: rgba(255, 238, 187, 0.55);
    }

    /* Both fonts - VT323 for body, Press Start 2P for accent */
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CRT scanlines - subtle */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Moving starfield from direction 2 */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 47px 192px, var(--gold), transparent),
        radial-gradient(1.5px 1.5px at 312px 96px, var(--blue), transparent),
        radial-gradient(1.5px 1.5px at 608px 312px, var(--pink), transparent),
        radial-gradient(1.5px 1.5px at 768px 144px, var(--green), transparent),
        radial-gradient(1.5px 1.5px at 608px 612px, var(--purple), transparent),
        radial-gradient(1.5px 1.5px at 248px 624px, var(--gold), transparent),
        radial-gradient(1.5px 1.5px at 528px 432px, var(--blue), transparent);
      background-repeat: no-repeat;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      animation: scrollStars 25s linear infinite;
    }

    @keyframes scrollStars {
      from { transform: translateY(0); }
      to { transform: translateY(-50px); }
    }

    /* Layout from direction 1 - status bar, centered hero, project list */
    .stage {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 32px;
      position: relative;
      z-index: 1;
    }

    .cabinet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 8px 4px;
      margin-bottom: 48px;
      /* Glow from direction 2 - subtle multi-color border glow */
      box-shadow:
        inset 0 8px 8px -8px rgba(255, 204, 51, 0.4),
        inset 0 -8px 8px -8px rgba(255, 102, 204, 0.4);
    }

    .cabinet-bar .left { font-weight: bold; color: var(--amber); }
    .cabinet-bar .right { font-size: 12px; opacity: 0.7; color: var(--green); }

    .hero {
      position: relative;
      text-align: center;
      padding: 32px 0 48px;
    }

    /* Title with chromatic aberration from direction 2 + amber base from 1 */
    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(56px, 11vw, 112px);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--amber);
      /* Triple-stack text-shadow: red ghost on right, blue ghost on left, gold glow center */
      text-shadow:
        0 0 24px rgba(255, 178, 68, 0.7),
        0 0 48px rgba(255, 178, 68, 0.4);
      margin-bottom: 12px;
    }

    .tagline {
      font-size: clamp(16px, 2.5vw, 22px);
      color: var(--blue);
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(68, 170, 255, 0.6);
      margin-bottom: 36px;
    }

    /* Press any key - kept from direction 1, with direction 2's pink glow */
    .press-key {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(11px, 1.6vw, 14px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--pink);
      text-shadow: 0 0 12px rgba(255, 102, 204, 0.8);
      animation: blink 1.1s steps(2) infinite;
      margin-bottom: 56px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Project cards - layout from direction 1, color accents from 2 */
    .projects {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--gold);
      border-bottom: 1px solid var(--gold);
      padding: 8px 0;
      box-shadow:
        inset 0 4px 8px -4px rgba(255, 204, 51, 0.3),
        inset 0 -4px 8px -4px rgba(255, 102, 204, 0.3);
    }

    .project {
      display: grid;
      grid-template-columns: 40px 1fr auto auto;
      align-items: center;
      gap: 24px;
      padding: 16px 12px;
      border-bottom: 1px dashed var(--gold);
      text-decoration: none;
      color: var(--text);
      transition: background 0.15s;
    }

    .project:last-child { border-bottom: none; }
    .project:hover {
      background: linear-gradient(90deg, rgba(255,204,51,0.1), rgba(255,102,204,0.05));
      box-shadow: inset 0 0 20px rgba(255, 204, 51, 0.2);
    }
    .project:hover .name { color: var(--gold); text-shadow: 0 0 12px var(--gold); }

    /* Project name with direction 2's initials badge style */
    .name {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(18px, 2.6vw, 22px);
      letter-spacing: 0.06em;
    }
    .name .initials {
      background: var(--gold);
      color: #000;
      padding: 4px 6px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      letter-spacing: 0.05em;
    }

    .rank {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 1.8vw, 18px);
      color: var(--gold);
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(255, 204, 51, 0.6);
    }

    .year {
      font-family: 'VT323', monospace;
      font-size: 14px;
      color: var(--blue);
      letter-spacing: 0.15em;
      text-shadow: 0 0 6px rgba(68, 170, 255, 0.5);
    }

    .score {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 1.4vw, 12px);
      color: var(--green);
      letter-spacing: 0.05em;
      text-shadow: 0 0 8px rgba(102, 255, 153, 0.6);
      padding: 5px 10px;
      border: 1px solid var(--green);
    }

    /* Footer with glow */
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--gold);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--blue);
      text-shadow: 0 0 6px rgba(68, 170, 255, 0.4);
    }
    .footer a { color: var(--gold); text-decoration: none; }
    .footer a:hover { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="cabinet-bar">
      <span class="left">Rook-O-Matic&nbsp;&nbsp;v0.2.18</span>
      <span class="right">CPU OK · RAM OK · ROM OK</span>
    </div>

    <div class="hero">
      <h1 class="title">ROOK</h1>
      <p class="tagline">open-source games &amp; tools, shipped from a workshop.</p>
      <div class="press-key">▌ press any key to continue</div>
    </div>

    <div class="projects">
      <a class="project" href="https://rookios72.github.io/asteroids/">
        <span class="rank">01</span>
        <span class="name">
          <span class="initials">AS</span>
          ASTEROIDS — 1979 PORT
        </span>
        <span class="year">VECTOR · 2026</span>
        <span class="score">LIVE</span>
      </a>
      <a class="project" href="https://rookios72.github.io/loderunner/">
        <span class="rank">02</span>
        <span class="name">
          <span class="initials">LR</span>
          LODE RUNNER — 1983 PORT
        </span>
        <span class="year">TILES · 2026</span>
        <span class="score">v0.2.6</span>
      </a>
      <div class="project">
        <span class="rank">03</span>
        <span class="name">
          <span class="initials">__</span>
          ____________ — NEXT
        </span>
        <span class="year">—</span>
        <span class="score">—</span>
      </div>
    </div>

    <div class="footer">
      <span>© 2026 · ROOK</span>
      <span><a href="https://github.com/RookiOS72">github.com/RookiOS72 →</a></span>
    </div>
  </div>
</body>
</html>
