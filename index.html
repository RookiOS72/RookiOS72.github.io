<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RookiOS72 — open-source games and tools</title>
<meta name="description" content="Faithful browser ports of classic games, open source and free to play: Asteroids (1979) and Lode Runner (1983). By RookiOS72.">
<meta name="theme-color" content="#1c2333">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Bricolage+Grotesque:wght@600;800&display=swap">
<style>
:root{--wall:#1c2333;--wall2:#232b3f;--wood:#7a5233;--wood2:#57371f;--ink:#f2efe6;--sig:#ff7a3d;--g:#3dff7a}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--wall)}
body{font-family:'Silkscreen',ui-monospace,monospace;color:var(--ink);padding:0 20px 28px;
  background:repeating-linear-gradient(90deg,var(--wall) 0 46px,var(--wall2) 46px 47px)}
header{max-width:860px;margin:0 auto;padding:30px 0 12px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{font:800 clamp(38px,7.5vw,68px)/.9 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
header p{font-size:11px;letter-spacing:.06em;max-width:34ch;color:#aab3c8;line-height:1.55}
.shelf{max-width:860px;margin:30px auto 0;display:flex;gap:34px;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:0 16px}
.plank{max-width:860px;margin:0 auto;height:22px;background:linear-gradient(var(--wood),var(--wood2));border-radius:3px;box-shadow:0 14px 26px rgba(0,0,0,.45)}
.m{position:relative;border:0;padding:0;background:none;cursor:pointer;color:inherit;font:inherit;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.m:hover,.m:focus-visible{transform:translateY(-14px) rotate(-1deg);outline:none}
.m:focus-visible::after{content:"";position:absolute;inset:-5px;border:3px solid var(--sig);border-radius:8px;pointer-events:none}
.m span{display:block}
/* ---- arcade PCB carrying the Asteroids artwork ---- */
.pcb{width:250px;height:178px;border-radius:4px 4px 2px 2px;box-shadow:0 0 0 2px #06210f inset,0 8px 0 -2px #0005;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(80,230,140,.16) 11px 12px),repeating-linear-gradient(0deg,transparent 0 13px,rgba(80,230,140,.12) 13px 14px),#0d3b21}
.pcb .c{position:absolute;background:#0a0c0b;border-radius:2px;box-shadow:0 0 0 1px #2c3a30}
.pcb .c::before{content:"";position:absolute;left:3px;right:3px;top:-3px;height:3px;background:repeating-linear-gradient(90deg,#9aa 0 3px,transparent 3px 6px)}
.pcb .c1{left:10px;top:12px;width:44px;height:18px}.pcb .c2{left:64px;top:12px;width:30px;height:18px}
.pcb .c3{left:198px;top:12px;width:44px;height:18px}.pcb .c4{left:10px;top:96px;width:36px;height:18px}.pcb .c5{left:204px;top:96px;width:38px;height:18px}
.pcb .fing{position:absolute;left:14px;right:14px;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#d8b45a 0 5px,transparent 5px 8px)}
.pcb .stk{position:absolute;left:52px;top:34px;width:146px;padding:5px;background:#efeee2;color:#111;text-align:center;box-shadow:0 1px 0 #0006}
.pcb .stk svg{display:block;width:100%;aspect-ratio:140/84;background:#000}
.pcb .stk b{display:block;margin-top:5px;font-size:11px;letter-spacing:.08em}
.pcb .stk small{display:block;font-size:8.5px;color:#444;letter-spacing:.08em}
/* ---- Apple II 5.25" floppy carrying the Lode Runner artwork ----
   Drawn after a real disk: square jacket, label top-left, big hub ring,
   small index hole beside it, a VERTICAL read/write slot below the hub,
   write-protect notch on the right edge, two tiny notches on the bottom. */
.floppy{width:200px;height:200px;background:#15171a;border-radius:4px;box-shadow:0 0 0 1px #2c3036 inset,0 0 0 2px #0a0b0c,0 8px 0 -2px #0005}
.floppy .lb{position:absolute;left:10px;top:10px;width:118px;background:#efeee2;color:#111;padding:5px 5px 4px;text-align:center}
.floppy .lb svg{display:block;width:100%;aspect-ratio:140/84;background:#0d1b4a}
.floppy .lb b{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.08em}
.floppy .lb small{display:block;font-size:7px;color:#444;letter-spacing:.05em}
.floppy .lb .rb{display:block;height:4px;margin-top:4px;background:linear-gradient(90deg,#61bb46 0 16.6%,#fdb827 0 33.3%,#f5821f 0 50%,#e03a3e 0 66.6%,#963d97 0 83.3%,#009ddc 0)}
.floppy .hub{position:absolute;left:79px;top:122px;width:42px;height:42px;border-radius:50%;background:var(--wall);border:5px solid #3a3e44;box-shadow:0 0 0 3px #0a0b0c}
.floppy .idx{position:absolute;left:134px;top:138px;width:9px;height:9px;border-radius:50%;background:var(--wall);border:2px solid #3a3e44}
.floppy .win{position:absolute;left:89px;top:168px;width:22px;height:26px;border-radius:12px;background:#3d4147;box-shadow:inset 0 0 0 2px #2a2d31}
.floppy .nt{position:absolute;right:0;top:54px;width:6px;height:16px;background:var(--wall)}
.floppy .bn1,.floppy .bn2{position:absolute;bottom:0;width:4px;height:4px;background:var(--wall)}
.floppy .bn1{left:52px}.floppy .bn2{left:124px}
.empty{width:120px;height:200px;border:2px dashed #ffffff33;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:9px;line-height:1.6;color:#ffffff66;cursor:default}
/* insertion: the piece drops toward the deck, then stays inside until ejected */
.m.ins{animation:ins .8s ease-in forwards;pointer-events:none;z-index:2}
@keyframes ins{60%{transform:translateY(120px)}100%{transform:translateY(190px) scale(.9);opacity:0}}
.m.inside{opacity:0;pointer-events:none}
/* ---- deck ---- */
.deck{max-width:640px;margin:46px auto 0;background:#0e1016;border-radius:14px;padding:16px;box-shadow:0 0 0 2px #2b2f3b,0 18px 40px rgba(0,0,0,.5);display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px}
@media(max-width:560px){.deck{grid-template-columns:1fr}}
.crt{background:#000;border-radius:10px;padding:8px;box-shadow:inset 0 0 20px rgba(61,255,122,.14),0 0 0 2px #1a1d26;position:relative}
.crt canvas{display:block;width:100%;aspect-ratio:4/3;background:#000;border-radius:5px;image-rendering:pixelated}
.crt::after{content:"";position:absolute;inset:8px;border-radius:5px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.22) 2px 3px)}
.crt.boot{animation:boot .42s ease-out}
@keyframes boot{0%{transform:scaleY(.02);filter:brightness(4)}55%{transform:scaleY(1.03);filter:brightness(2)}100%{transform:none;filter:none}}
.side{display:grid;gap:12px;align-content:start}
.slots{display:grid;gap:10px}
.slot{position:relative;height:30px;background:#000;border-radius:3px;box-shadow:inset 0 3px 6px #000,0 1px 0 #fff2;font-size:8.5px;letter-spacing:.1em;color:#5d6577;display:flex;align-items:center;padding:0 10px;gap:8px}
.slot.drive{height:22px}.slot.drive::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:#3b1a1a}
.slot.on{color:var(--g);box-shadow:inset 0 3px 6px #000,0 0 14px rgba(61,255,122,.35)}
.slot.drive.on::before{background:#ff4b3b;box-shadow:0 0 8px #ff4b3b}
.status{background:#031a0c;border-radius:8px;padding:10px 12px;min-height:88px;font-size:10px;letter-spacing:.06em;color:#59ff8c;text-shadow:0 0 6px #3dff7a;line-height:1.8}
.status a{color:#eafff0}
.status button{font:inherit;color:var(--g);background:none;border:1px solid #1f9c4a;padding:1px 8px;margin-left:8px;cursor:pointer}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
footer{max-width:860px;margin:26px auto 0;font-size:10px;letter-spacing:.1em;color:#7f89a3;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--sig);text-decoration:none}
@media(prefers-reduced-motion:reduce){.m,.m.ins,.crt.boot{transition:none;animation:none}.m.ins{opacity:0}}
</style></head>
<body>
<header><h1>RookiOS72</h1><p>OPEN-SOURCE GAMES &amp; TOOLS, SHIPPED FROM A WORKSHOP. EACH ONE ON THE MEDIUM IT SHIPPED ON. PICK ONE.</p></header>

<div class="shelf">
  <button class="m pcb" data-id="asteroids" aria-label="Asteroids, Atari arcade board, 1979">
    <span class="c c1"></span><span class="c c2"></span><span class="c c3"></span><span class="c c4"></span><span class="c c5"></span>
    <span class="stk">
      <svg viewBox="0 0 140 84" role="img" aria-label="Asteroids artwork"><rect width="140" height="84" fill="#020202"/>
        <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round">
          <path d="M18 22l13-8 14 6 5 15-10 13-15 2-9-12z"/><path d="M96 10l18 4 6 17-12 12-18-6-2-16z"/><path d="M92 58l12-6 14 8-2 14-14 4-12-8z"/><path d="M10 62l10-4 8 6-2 10-10 2z"/>
          <path d="M66 46l6 16-6-4-6 4z" stroke="#ffd35a"/></g>
        <path d="M69 40v-14M69 20v-2" stroke="#ffd35a" stroke-width="1.5" stroke-dasharray="2 4"/></svg>
      <b>ASTEROIDS</b><small>ATARI · 1979 · VECTOR</small>
    </span>
    <span class="fing"></span>
  </button>

  <button class="m floppy" data-id="lode-runner" aria-label="Lode Runner, Apple II floppy disk, 1983">
    <span class="lb">
      <svg viewBox="0 0 140 84" role="img" aria-label="Lode Runner artwork"><rect width="140" height="84" fill="#0d1b4a"/>
        <g fill="#e2622f"><rect x="0" y="30" width="140" height="9"/><rect x="0" y="72" width="140" height="12"/></g>
        <g stroke="#7a2c10" stroke-width="1"><path d="M0 34.5h140M22 30v9M52 30v9M84 30v9M114 30v9M0 78h140M30 72v6M74 72v6M112 72v6"/></g>
        <g stroke="#ffe27a" stroke-width="2.4" fill="none"><path d="M100 39v33M112 39v33M100 47h12M100 55h12M100 63h12"/></g>
        <path d="M8 14h66" stroke="#eee" stroke-width="2" stroke-dasharray="6 3"/>
        <g fill="#ffd35a"><rect x="34" y="63" width="8" height="8"/><rect x="60" y="21" width="8" height="8"/></g>
        <g fill="#fff"><circle cx="20" cy="58" r="3.4"/><rect x="17" y="61" width="6" height="11"/></g></svg>
      <b>LODE RUNNER</b><small>BRØDERBUND · 1983</small><i class="rb"></i>
    </span>
    <span class="hub"></span><span class="idx"></span><span class="win"></span><span class="nt"></span><span class="bn1"></span><span class="bn2"></span>
  </button>

  <div class="m empty">NEXT<br>MEDIA<br>COMING</div>
</div>
<div class="plank"></div>
<noscript><p style="text-align:center;margin:24px;font-size:12px;line-height:2"><a style="color:#ff7a3d" href="https://rookios72.github.io/asteroids/">ASTEROIDS</a> · <a style="color:#ff7a3d" href="https://rookios72.github.io/loderunner/">LODE RUNNER</a></p></noscript>

<div class="deck">
  <div class="crt" id="crt"><canvas id="cv" width="320" height="240" aria-label="Live preview of the loaded game on its original machine"></canvas></div>
  <div class="side">
    <div class="slots">
      <div class="slot board" id="s-arc">ARCADE BOARD SLOT</div>
      <div class="slot drive" id="s-flop">5.25" DISK DRIVE</div>
    </div>
    <div class="status" id="scr">READY.<br>&gt; PICK A GAME FROM THE SHELF<span class="blink">▮</span></div>
  </div>
</div>

<footer><span>© 2026 ROOKIOS72</span><a href="https://github.com/RookiOS72" target="_blank" rel="noopener">GITHUB.COM/ROOKIOS72 →</a></footer>

<script>
const G={
 asteroids:{name:'ASTEROIDS',sub:'ATARI · 1979 · VECTOR BOARD',plat:'arc',url:'https://rookios72.github.io/asteroids/',slot:'s-arc'},
 'lode-runner':{name:'LODE RUNNER',sub:'BRØDERBUND · 1983 · APPLE II FLOPPY',plat:'apple',url:'https://rookios72.github.io/loderunner/',slot:'s-flop'}};
const $=id=>document.getElementById(id);
let cur=null,mode='idle';
function eject(){
  if(!cur)return;const el=document.querySelector(`.m[data-id="${cur}"]`);
  el.classList.remove('ins','inside');$(G[cur].slot).classList.remove('on');cur=null;mode='idle';
  $('scr').innerHTML='EJECTED.<br>&gt; PICK A GAME FROM THE SHELF<span class="blink">▮</span>';
}
function insert(id){
  if(cur===id)return;eject();cur=id;const g=G[id],el=document.querySelector(`.m[data-id="${id}"]`);
  el.classList.add('ins');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{el.classList.remove('ins');el.classList.add('inside')},reduce?0:800);
  $(g.slot).classList.add('on');mode=g.plat;
  const c=$('crt');c.classList.remove('boot');void c.offsetWidth;c.classList.add('boot');
  $('scr').innerHTML=`LOADING ${g.name} .......<br>${g.sub}<br><a href="${g.url}" target="_blank" rel="noopener">&gt; PRESS START</a><button id="ej">EJECT ⏏</button>`;
  $('ej').onclick=eject;
}
document.querySelectorAll('.m[data-id]').forEach(b=>b.onclick=()=>insert(b.dataset.id));

// ---- machine-native previews on the deck's screen ----
const cv=$('cv'),x=cv.getContext('2d'),W=320,H=240;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(5);
const rocks=[...Array(6)].map(()=>{const r=14+R()*22,p=[];for(let k=0;k<10;k++){const a=k/10*6.283,d=r*(.72+R()*.4);p.push([Math.cos(a)*d,Math.sin(a)*d])}return{x:R()*W,y:R()*H,vx:(R()-.5)*26,vy:(R()-.5)*26,a:R()*6,va:(R()-.5)*.7,p}});
let ship=0;
function vector(dt){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);x.strokeStyle='#e9fff6';x.lineWidth=1.3;x.shadowColor='#8dffe0';x.shadowBlur=6;ship+=dt*.8;
  rocks.forEach(r=>{r.x=(r.x+r.vx*dt+W)%W;r.y=(r.y+r.vy*dt+H)%H;r.a+=r.va*dt;x.save();x.translate(r.x,r.y);x.rotate(r.a);x.beginPath();r.p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.stroke();x.restore()});
  x.save();x.translate(W/2,H/2);x.rotate(ship);x.beginPath();x.moveTo(11,0);x.lineTo(-7,-6);x.lineTo(-4,0);x.lineTo(-7,6);x.closePath();x.stroke();x.restore();x.shadowBlur=0}
const rows=["................................","..E.G...........................","bBBbBBbBBBb#bbbbbbB.............","...........#-----------.........","...........#....bb#.............","...........#..E.bb#......G......","...........#....bb#...bbbbb#bbbb","...........#....bb#........#....","...........#....bb#........#....","...........#....bb#.......G#....","bbb#bbbbbbbb....bbbbbbbb#bbbbbbb"].map(r=>r.replace(/E/g,'.'));
const T=10,OY=(H-rows.length*T)/2|0,C={brick:'#ff6a3c',solid:'#d15dff',ladder:'#14f53c',rope:'#fff',gold:'#14cffd'};
const path=[[0,1],[11,1],[11,3],[22,3]];let seg=0,pos=[0,1],hold=0,got=false,gt=0;
function person(cx,cy,f){x.fillStyle='#fff';x.beginPath();x.arc(cx,cy-6,2.6,0,7);x.fill();x.fillRect(cx-2.5,cy-3,5,6);x.fillRect(cx-2.5,cy+3,2,4+f);x.fillRect(cx+.5,cy+3,2,4-f)}
function apple(dt){gt+=dt;
  if(hold>0){hold-=dt;if(hold<=0){seg=0;pos=[0,1];got=false}}
  else{const to=path[seg+1];if(!to)hold=1.1;else{const dx=to[0]-pos[0],dy=to[1]-pos[1],d=Math.hypot(dx,dy),s=(dy?3:5)*dt;if(d<=s){pos=to.slice();seg++}else{pos[0]+=dx/d*s;pos[1]+=dy/d*s}}}
  if(Math.hypot(pos[0]-4,pos[1]-1)<.5)got=true;
  x.fillStyle='#000';x.fillRect(0,0,W,H);
  rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const px=i*T,py=OY+j*T;
    if(ch==='b'){x.fillStyle=C.brick;x.fillRect(px,py,T,T);x.fillStyle='#000';x.fillRect(px,py+4,T,1);x.fillRect(px,py+9,T,1);x.fillRect(px+(j%2?2:7),py,1,5)}
    else if(ch==='B'){x.fillStyle=C.solid;x.fillRect(px,py,T,T);x.fillStyle='#000';x.fillRect(px,py+4,T,1);x.fillRect(px,py+9,T,1)}
    else if(ch==='#'){x.fillStyle=C.ladder;x.fillRect(px+2,py,1,T);x.fillRect(px+7,py,1,T);for(let k=1;k<T;k+=3)x.fillRect(px+2,py+k,6,1)}
    else if(ch==='-'){x.fillStyle=C.rope;x.fillRect(px,py+4,T,2)}
    else if(ch==='G'&&!(got&&i===4&&j===1)){x.fillStyle=C.gold;x.fillRect(px+2,py+3,6,6);x.fillStyle='#fff';x.fillRect(px+3,py+4,2,1)}}));
  person(pos[0]*T+T/2,OY+pos[1]*T+T/2+1,Math.sin(gt*16)>0?1:-1)}
function idle(){x.fillStyle='#000';x.fillRect(0,0,W,H);for(let i=0;i<50;i++){x.fillStyle=`rgba(61,255,122,${Math.random()*.35})`;x.fillRect(Math.random()*W,Math.random()*H,W*.3*Math.random(),1)}
  x.fillStyle='#3dff7a';x.font='14px "Silkscreen", monospace';x.textAlign='center';x.fillText('INSERT MEDIA',W/2,H/2)}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(mode==='arc')vector(dt);else if(mode==='apple')apple(dt);else idle();
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
