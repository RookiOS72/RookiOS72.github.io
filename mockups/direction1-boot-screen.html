<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rook — boot screen mockup</title>
  <style>
    /* Direction 1: "Boot screen"
       Visual: monochrome amber/green phosphor CRT, minimal layout, "PRESS
       ANY KEY" blink, score displays in the corner. Looks like a 1983 Atari
       cabinet when you first power it on. */

    :root {
      /* Color palette - amber phosphor CRT */
      --bg: #0a0604;
      --phosphor: #ffb244;
      --phosphor-dim: rgba(255, 178, 68, 0.55);
      --phosphor-glow: rgba(255, 178, 68, 0.18);
    }

    /* Hard pixel font - this is the MAME/VICE-style "deterministic bitmap" feel.
       Using a Google Font that mimics 80s computer terminal type. */
    @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg);
      color: var(--phosphor);
      font-family: 'VT323', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* CRT scanlines overlay - alternating darker horizontal stripes */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    /* Subtle vignette */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 99;
    }

    /* Slight chromatic aberration on text - red ghost on one side, cyan on other */
    .ghost-r {
      text-shadow: 1px 0 0 rgba(255, 0, 0, 0.4);
    }

    .stage {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 32px;
      position: relative;
      z-index: 1;
    }

    /* Top status bar - cabinet header strip */
    .cabinet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--phosphor-dim);
      border-top: 1px solid var(--phosphor-glow);
      border-bottom: 1px solid var(--phosphor-glow);
      padding: 8px 4px;
      margin-bottom: 48px;
    }

    .cabinet-bar .left { font-weight: bold; }
    .cabinet-bar .right { font-size: 12px; opacity: 0.7; }

    /* Self-test pattern - vertical scanline, very subtle */
    .hero {
      position: relative;
      text-align: center;
      padding: 32px 0 48px;
    }

    .title {
      font-size: clamp(56px, 11vw, 112px);
      letter-spacing: 0.08em;
      line-height: 1;
      color: var(--phosphor);
      text-shadow:
        2px 0 0 rgba(255, 40, 0, 0.45),
       -2px 0 0 rgba(0, 200, 255, 0.45),
        0 0 18px var(--phosphor-glow);
      margin-bottom: 8px;
    }

    .tagline {
      font-size: clamp(16px, 2.5vw, 22px);
      color: var(--phosphor-dim);
      letter-spacing: 0.05em;
      margin-bottom: 36px;
    }

    /* Press-any-key style - the classic arcade attract mode hook */
    .press-key {
      display: inline-block;
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--phosphor);
      animation: blink 1.1s steps(2) infinite;
      margin-bottom: 56px;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Projects rendered as "high score entries" */
    .projects {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--phosphor-glow);
      border-bottom: 1px solid var(--phosphor-glow);
      padding: 8px 0;
    }

    .project {
      display: grid;
      grid-template-columns: 40px 1fr auto auto;
      align-items: center;
      gap: 24px;
      padding: 16px 8px;
      border-bottom: 1px dashed var(--phosphor-glow);
      text-decoration: none;
      color: var(--phosphor);
      transition: background 0.1s;
    }

    .project:last-child { border-bottom: none; }
    .project:hover { background: var(--phosphor-glow); }
    .project:hover .name { text-shadow: 0 0 12px var(--phosphor); }

    .rank {
      font-size: clamp(20px, 3vw, 28px);
      color: var(--phosphor-dim);
      letter-spacing: 0.05em;
    }

    .name {
      font-size: clamp(18px, 2.6vw, 22px);
      letter-spacing: 0.06em;
    }

    .year {
      font-size: 12px;
      color: var(--phosphor-dim);
      letter-spacing: 0.15em;
    }

    .score {
      font-family: 'VT323', monospace;
      font-size: 18px;
      color: var(--phosphor);
    }

    .play-link {
      color: var(--phosphor);
      text-decoration: none;
      letter-spacing: 0.15em;
      font-size: 13px;
      border: 1px solid var(--phosphor);
      padding: 4px 10px;
    }
    .play-link:hover { background: var(--phosphor); color: var(--bg); }

    /* Footer - arcade bottom strip */
    .footer {
      margin-top: 48px;
      padding-top: 16px;
      border-top: 1px solid var(--phosphor-glow);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--phosphor-dim);
    }
    .footer a { color: var(--phosphor); text-decoration: none; }
    .footer a:hover { color: var(--phosphor-dim); }
  </style>
</head>
<body>
  <div class="stage">
    <div class="cabinet-bar ghost-r">
      <span class="left">Rook-O-Matic&nbsp;&nbsp;v0.2.18</span>
      <span class="right">CPU OK · RAM OK · ROM OK</span>
    </div>

    <div class="hero">
      <h1 class="title">ROOK</h1>
      <p class="tagline">open-source games &amp; tools, shipped from a workshop.</p>
      <div class="press-key">▌ press any key to continue</div>
    </div>

    <div class="projects">
      <a class="project" href="https://rookios72.github.io/asteroids/">
        <span class="rank">01</span>
        <span class="name">▌ ASTEROIDS — 1979 port</span>
        <span class="year">VECTOR · 2026</span>
        <span class="score">LIVE</span>
      </a>
      <a class="project" href="https://rookios72.github.io/loderunner/">
        <span class="rank">02</span>
        <span class="name">▌ LODE RUNNER — 1983 port</span>
        <span class="year">TILES · 2026</span>
        <span class="score">v0.2.6</span>
      </a>
      <div class="project">
        <span class="rank">03</span>
        <span class="name">▌ ____________ — next</span>
        <span class="year">—</span>
        <span class="score">—</span>
      </div>
    </div>

    <div class="footer ghost-r">
      <span>© 2026 · ROOK</span>
      <span><a href="https://github.com/RookiOS72">github.com/RookiOS72 →</a></span>
    </div>
  </div>
</body>
</html>
